<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Project pages — Portfolio Admin</title>
<link rel="stylesheet" href="/admin/admin.css">
</head>
<body class="pages-app">

<header class="topbar">
  <h1>Martin Pošta — Portfolio Admin</h1>
  <nav class="apptabs"><a href="/admin/">Gallery</a><a href="/admin/pages.html" aria-current="page">Project pages</a></nav>
  <div class="topbar-actions">
    <span id="status" class="status"></span>
    <span id="repo" class="repo" title="State of this copy against GitHub"><span class="dot"></span><span id="repo-text">checking…</span></span>
    <button id="btn-save" class="btn primary">Save &amp; publish<span id="count" class="count" hidden></span></button>
  </div>
</header>

<div id="banner" class="banner" hidden></div>
<div id="pagebar" class="pagebar"></div>

<div class="work">
  <section id="editor" class="pg-editor" aria-label="Edit page"></section>
  <section class="pv-col" aria-label="Preview">
    <div class="pv-bar">
      <span id="pv-url" class="pv-url"></span>
      <div class="seg" role="group" aria-label="Preview width">
        <button data-w="desk" aria-pressed="true">Desktop</button>
        <button data-w="phone" aria-pressed="false">Phone</button>
      </div>
    </div>
    <div id="stage" class="pv-stage"><iframe id="pv" title="Page preview"></iframe></div>
  </section>
</div>

<!-- Publish dialog -->
<div id="pub" class="modal-scrim" hidden>
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="pub-title">
    <h2 id="pub-title">Publish to martinposta.com</h2>
    <ul id="pub-changes" class="changes"></ul>
    <label class="modal-field">Commit message
      <input type="text" id="pub-msg">
    </label>
    <p id="pub-result" class="pub-result" hidden></p>
    <div class="edit-actions">
      <div class="spacer"></div>
      <button type="button" id="pub-cancel" class="btn ghost">Cancel</button>
      <button type="button" id="pub-go" class="btn primary">Publish</button>
    </div>
  </div>
</div>

<input type="file" id="file-photos" accept="image/jpeg,image/png,image/webp" multiple hidden>
<input type="file" id="file-doodle" accept=".svg,.png,.webp,.gif,.webm,.mp4" hidden>

<script src="/admin/common.js"></script>
<script src="/admin/pages.js"></script>
</body>
</html>
