<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Portfolio Admin</title>
<link rel="stylesheet" href="/admin/admin.css">
</head>
<body class="gallery-app">

<header class="topbar">
  <h1>Martin Pošta — Portfolio Admin</h1>
  <nav class="apptabs"><a href="/admin/" aria-current="page">Gallery</a><a href="/admin/pages.html">Project pages</a></nav>
  <div class="topbar-actions">
    <span id="status" class="status"></span>
    <label class="branch-pick" title="Which version of the site this admin works on">Branch
      <select id="branch"><option>…</option></select>
    </label>
    <span id="repo" class="repo" title="State of this copy against GitHub"><span class="dot"></span><span id="repo-text">checking…</span></span>
    <button id="btn-save" class="btn primary">Save &amp; publish<span id="count" class="count" hidden></span></button>
  </div>
</header>

<div id="banner" class="banner" hidden></div>

<div class="work gallery-work">
<section class="list-col" aria-label="Cards">
<main>
  <div class="toolbar">
    <button id="btn-add" class="btn">+ Add new card</button>
    <div class="seg" role="group" aria-label="Show">
      <button data-show="all" aria-pressed="true">All <span id="n-all"></span></button>
      <button data-show="live" aria-pressed="false">Live <span id="n-live"></span></button>
      <button data-show="draft" aria-pressed="false">Drafts <span id="n-draft"></span></button>
    </div>
    <span class="hint">Drag ⠿ to reorder (in “All”). The eye puts a card live or makes it a draft.</span>
  </div>
  <ul id="card-list" class="card-list"></ul>
</main>

<!-- Edit panel: covers the card list, never the preview -->
<div id="overlay" class="overlay hidden"></div>
<aside id="edit-panel" class="edit-panel hidden">
  <div class="edit-panel-head">
    <h2 id="edit-title">Edit card</h2>
    <button id="btn-close-edit" class="btn ghost">✕</button>
  </div>
  <form id="edit-form" class="edit-form">
    <label>Title
      <input type="text" name="title" required>
    </label>
    <label>Role / credit line
      <input type="text" name="role">
    </label>
    <label>Category
      <select name="category">
        <option value="feature">feature</option>
        <option value="vfx">vfx</option>
        <option value="games">games</option>
        <option value="shorts">shorts / others</option>
      </select>
    </label>
    <label>Flag label (small tag on the card, e.g. "Feature", "VFX", "Game")
      <input type="text" name="flag">
    </label>

    <fieldset>
      <legend>Thumbnail</legend>
      <label class="radio"><input type="radio" name="thumbType" value="photo"> Photo</label>
      <label class="radio"><input type="radio" name="thumbType" value="icon"> Icon</label>
      <div id="thumb-photo-fields" class="sub-fields">
        <label>Image path
          <input type="text" name="thumbSrc" placeholder="/images/thumbs/example_thumb.jpg">
        </label>
        <label>Upload a new thumbnail (writes into /images/thumbs/ and fills the path above)
          <input type="file" id="thumb-upload" accept="image/*">
        </label>
        <img id="thumb-preview" class="thumb-preview" alt="">
      </div>
      <div id="thumb-icon-fields" class="sub-fields">
        <label>Icon
          <select name="thumbIcon"></select>
        </label>
      </div>
    </fieldset>

    <fieldset>
      <legend>Click behaviour</legend>
      <label class="radio"><input type="radio" name="interactionType" value="link"> External link (opens in a new tab)</label>
      <label class="radio"><input type="radio" name="interactionType" value="page"> Dedicated project page</label>
      <label class="radio"><input type="radio" name="interactionType" value="lightbox"> Lightbox (video + description)</label>

      <div id="fields-link" class="sub-fields">
        <label>URL
          <input type="text" name="linkHref" placeholder="https://…">
        </label>
      </div>

      <div id="fields-page" class="sub-fields">
        <label>Project page path
          <input type="text" name="pageHref" placeholder="/projects/example.html">
        </label>
      </div>

      <div id="fields-lightbox" class="sub-fields">
        <label>Lightbox title
          <input type="text" name="lbTitle">
        </label>
        <label>Description
          <textarea name="lbDesc" rows="3"></textarea>
        </label>
        <label>Video embed URL
          <input type="text" name="lbVideo" placeholder="https://player.vimeo.com/video/…">
        </label>
        <label>Link URL (optional — e.g. Steam or IMDb)
          <input type="text" name="lbLink" placeholder="https://…">
        </label>
        <label>Link label
          <input type="text" name="lbLinkLabel" placeholder="Buy on Steam / IMDb">
        </label>
        <label>Background variant
          <select name="lbPin">
            <option value="">default</option>
            <option value="2">pin-2</option>
            <option value="3">pin-3</option>
            <option value="4">pin-4</option>
          </select>
        </label>
      </div>
    </fieldset>

    <div class="edit-actions">
      <button type="button" id="btn-delete" class="btn danger">Delete card</button>
      <div class="spacer"></div>
      <button type="button" id="btn-cancel-edit" class="btn ghost">Cancel</button>
      <button type="submit" class="btn primary">Apply changes</button>
    </div>
  </form>
</aside>
</section>

<section class="pv-col" aria-label="Preview">
  <div class="pv-bar">
    <span class="pv-url">Homepage with your unsaved edits · drafts dashed · click a card to edit it</span>
    <div class="seg" role="group" aria-label="Preview width">
      <button data-w="desk" aria-pressed="true">Desktop</button>
      <button data-w="phone" aria-pressed="false">Phone</button>
    </div>
    <button id="btn-preview" class="btn">Open in new tab</button>
  </div>
  <div id="stage" class="pv-stage"><iframe id="pv" title="Homepage preview"></iframe></div>
</section>
</div>

<!-- Publish dialog -->
<div id="pub" class="modal-scrim" hidden>
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="pub-title">
    <h2 id="pub-title">Publish to martinposta.com</h2>
    <ul id="pub-changes" class="changes"></ul>
    <label class="modal-field">Commit message
      <input type="text" id="pub-msg">
    </label>
    <p id="pub-result" class="pub-result" hidden></p>
    <div class="edit-actions">
      <div class="spacer"></div>
      <button type="button" id="pub-cancel" class="btn ghost">Cancel</button>
      <button type="button" id="pub-go" class="btn primary">Publish</button>
    </div>
  </div>
</div>

<script src="/admin/common.js"></script>
<script src="/admin/admin.js"></script>
</body>
</html>
