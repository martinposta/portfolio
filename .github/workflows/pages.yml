# Publishes site/ (and nothing else) to GitHub Pages on every push to main.
# Pages source = "GitHub Actions" since 2026-09-27; before that it built the
# redesign branch, which stays as the rollback: switching the source back to
# "Deploy from a branch: redesign" restores the old site.
name: Publish site

on:
  push:
    branches: [main]
    paths: ['site/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # notebook.css?v=<hash>: browsers keep /assets for 4 h (Cloudflare), so a
      # changed file must get a new URL. Only the published copy is stamped.
      - name: Fingerprint stylesheet and script links
        run: node admin/tools/stamp-assets.js site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
