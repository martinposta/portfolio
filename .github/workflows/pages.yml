# Publishes site/ (and nothing else) to GitHub Pages.
#
# Manual trigger only until Pages is switched from the `redesign` branch to
# "GitHub Actions". While Pages still builds from a branch, a deploy from
# here would fail on every push. At the switch, add:
#
#   push:
#     branches: [main]
name: Publish site

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
